<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IDENTITY PROTOCOL</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #06060a;
  --surface: rgba(255,255,255,0.03);
  --surface-hover: rgba(255,255,255,0.05);
  --border: rgba(255,255,255,0.06);
  --border-bright: rgba(255,255,255,0.12);
  --text: #f0f0f8;
  --muted: rgba(240,240,248,0.35);
  --muted2: rgba(240,240,248,0.55);
  --accent: #7fffb2;
  --accent2: #00e5ff;
  --accent3: #ff6b6b;
  --gold: #ffd166;
  --purple: #b388ff;
}

html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Outfit', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
}

/* ═══ CANVAS BG ═══ */
#bg-canvas {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
}

/* ═══ AMBIENT GLOW ═══ */
.ambient {
  position: fixed;
  border-radius: 50%;
  filter: blur(120px);
  pointer-events: none;
  z-index: 0;
  transition: opacity 3s ease;
}

.ambient-1 {
  width: 600px; height: 600px;
  top: -200px; left: -100px;
  background: radial-gradient(circle, rgba(127,255,178,0.06) 0%, transparent 70%);
  animation: drift1 20s ease-in-out infinite;
}

.ambient-2 {
  width: 500px; height: 500px;
  top: 40%; right: -150px;
  background: radial-gradient(circle, rgba(0,229,255,0.05) 0%, transparent 70%);
  animation: drift2 25s ease-in-out infinite;
}

.ambient-3 {
  width: 400px; height: 400px;
  bottom: 0; left: 30%;
  background: radial-gradient(circle, rgba(179,136,255,0.04) 0%, transparent 70%);
  animation: drift3 18s ease-in-out infinite;
}

@keyframes drift1 { 0%,100%{transform:translate(0,0)} 33%{transform:translate(40px,-30px)} 66%{transform:translate(-20px,40px)} }
@keyframes drift2 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-40px,30px)} }
@keyframes drift3 { 0%,100%{transform:translate(0,0)} 40%{transform:translate(30px,-20px)} 80%{transform:translate(-30px,10px)} }

/* ═══ LAYOUT ═══ */
.app {
  position: relative;
  z-index: 1;
  max-width: 720px;
  margin: 0 auto;
  padding: 0 28px 140px;
}

/* ═══ HEADER ═══ */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 36px 0 0;
  margin-bottom: 56px;
}

.logo {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.logo-main {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 6px;
  text-transform: uppercase;
  color: var(--accent);
}

.logo-sub {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 2px;
}

.header-right {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 4px;
}

.header-date {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--muted);
  letter-spacing: 1px;
}

.header-time {
  font-family: 'JetBrains Mono', monospace;
  font-size: 18px;
  font-weight: 500;
  color: var(--muted2);
  letter-spacing: 2px;
}

/* ═══ HERO SCORE ═══ */
.hero {
  text-align: center;
  margin-bottom: 72px;
  position: relative;
}

.hero-ring-wrap {
  position: relative;
  width: 200px;
  height: 200px;
  margin: 0 auto 32px;
}

#score-ring {
  width: 200px;
  height: 200px;
  transform: rotate(-90deg);
}

.hero-inner {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
}

.hero-score-num {
  font-size: 56px;
  font-weight: 900;
  line-height: 1;
  letter-spacing: -3px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  transition: all 0.5s ease;
}

.hero-score-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  letter-spacing: 4px;
  color: var(--muted);
  text-transform: uppercase;
}

.hero-verdict {
  font-size: 16px;
  font-weight: 500;
  color: var(--muted2);
  max-width: 380px;
  margin: 0 auto 24px;
  line-height: 1.5;
  min-height: 48px;
  transition: opacity 0.5s;
}

/* Week dots */
.week-track {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-bottom: 8px;
}

.week-col { display: flex; flex-direction: column; align-items: center; gap: 6px; }

.week-pip {
  width: 32px;
  height: 4px;
  border-radius: 2px;
  background: var(--border-bright);
  transition: all 0.5s ease;
  position: relative;
  overflow: hidden;
}

.week-pip::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1);
}

.week-pip.full::after { transform: scaleX(1); }
.week-pip.partial::after { transform: scaleX(0.5); background: linear-gradient(90deg, var(--gold), var(--gold)); }
.week-pip.today-pip { box-shadow: 0 0 8px rgba(127,255,178,0.3); }

.week-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  color: var(--muted);
  letter-spacing: 1px;
}

/* ═══ RANK BAR ═══ */
.rank-bar-section {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 20px 24px;
  margin-bottom: 48px;
  position: relative;
  overflow: hidden;
  backdrop-filter: blur(10px);
}

.rank-bar-section::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 16px;
  padding: 1px;
  background: linear-gradient(135deg, rgba(127,255,178,0.15), rgba(0,229,255,0.1), transparent);
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  pointer-events: none;
}

.rank-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
}

.rank-name-display {
  font-size: 18px;
  font-weight: 800;
  letter-spacing: 1px;
  text-transform: uppercase;
}

.rank-xp-display {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--accent);
}

.rank-progress-bg {
  height: 6px;
  background: rgba(255,255,255,0.06);
  border-radius: 3px;
  overflow: hidden;
  margin-bottom: 10px;
}

.rank-progress-fill {
  height: 100%;
  border-radius: 3px;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  transition: width 1.2s cubic-bezier(0.23, 1, 0.32, 1);
  position: relative;
}

.rank-progress-fill::after {
  content: '';
  position: absolute;
  top: 0; right: 0; bottom: 0;
  width: 60px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4));
  animation: shine 2s ease-in-out infinite;
}

@keyframes shine { 0%,100%{opacity:0} 50%{opacity:1} }

.rank-next {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 1px;
}

/* ═══ HABITS ═══ */
.habits-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.habits-title {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 4px;
  color: var(--muted);
  text-transform: uppercase;
}

.add-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  background: rgba(127,255,178,0.08);
  border: 1px solid rgba(127,255,178,0.2);
  color: var(--accent);
  font-family: 'Outfit', sans-serif;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 1px;
  padding: 10px 18px;
  border-radius: 100px;
  cursor: pointer;
  transition: all 0.25s ease;
}

.add-btn:hover {
  background: rgba(127,255,178,0.15);
  border-color: rgba(127,255,178,0.4);
  transform: translateY(-1px);
  box-shadow: 0 8px 24px rgba(127,255,178,0.1);
}

.habits-grid {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 56px;
}

/* ═══ HABIT CARD ═══ */
.habit-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 24px;
  position: relative;
  overflow: hidden;
  cursor: default;
  transition: all 0.3s ease;
  backdrop-filter: blur(10px);
}

.habit-card::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 20px;
  opacity: 0;
  transition: opacity 0.3s;
  background: radial-gradient(ellipse at 20% 50%, rgba(127,255,178,0.06) 0%, transparent 60%);
  pointer-events: none;
}

.habit-card:hover { border-color: var(--border-bright); transform: translateY(-2px); box-shadow: 0 16px 48px rgba(0,0,0,0.4); }
.habit-card:hover::before { opacity: 1; }

.habit-card.done {
  border-color: rgba(127,255,178,0.2);
}

.habit-card.done::before {
  opacity: 1;
  background: radial-gradient(ellipse at 20% 50%, rgba(127,255,178,0.08) 0%, transparent 60%);
}

.habit-card.broken {
  border-color: rgba(255,107,107,0.2);
}

.habit-card.broken::before {
  opacity: 1;
  background: radial-gradient(ellipse at 20% 50%, rgba(255,107,107,0.06) 0%, transparent 60%);
}

/* Glow line top */
.habit-card-glow {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  opacity: 0;
  transition: opacity 0.5s;
}

.habit-card.done .habit-card-glow {
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
  opacity: 1;
}

.habit-card.broken .habit-card-glow {
  background: linear-gradient(90deg, transparent, var(--accent3), transparent);
  opacity: 0.7;
}

.habit-row1 {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 16px;
}

.habit-identity {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  letter-spacing: 3px;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: 6px;
}

.habit-name {
  font-size: 19px;
  font-weight: 700;
  letter-spacing: -0.3px;
  line-height: 1.2;
}

/* CHECK BUTTON */
.check-btn {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  border: 1.5px solid var(--border-bright);
  background: transparent;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  position: relative;
  overflow: hidden;
}

.check-btn::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: radial-gradient(circle, var(--accent) 0%, transparent 70%);
  opacity: 0;
  transform: scale(0);
  transition: all 0.4s ease;
}

.check-btn:hover {
  border-color: var(--accent);
  transform: scale(1.1);
  box-shadow: 0 0 20px rgba(127,255,178,0.2);
}

.check-btn.checked {
  border-color: var(--accent);
  background: rgba(127,255,178,0.12);
  box-shadow: 0 0 24px rgba(127,255,178,0.3), inset 0 0 12px rgba(127,255,178,0.1);
}

.check-btn.checked::before {
  opacity: 0.15;
  transform: scale(1);
}

.check-icon {
  font-size: 18px;
  transition: all 0.3s;
  z-index: 1;
  color: var(--muted);
}

.check-btn.checked .check-icon {
  color: var(--accent);
  text-shadow: 0 0 12px rgba(127,255,178,0.8);
}

/* STATS ROW */
.habit-stats {
  display: flex;
  align-items: center;
  gap: 20px;
}

.stat-block {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.stat-val {
  font-size: 26px;
  font-weight: 800;
  line-height: 1;
  letter-spacing: -1px;
  transition: color 0.5s;
}

.stat-val.col-green { color: var(--accent); text-shadow: 0 0 20px rgba(127,255,178,0.4); }
.stat-val.col-gold { color: var(--gold); text-shadow: 0 0 20px rgba(255,209,102,0.3); }
.stat-val.col-muted { color: var(--muted2); }

.stat-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  color: var(--muted);
  letter-spacing: 2px;
  text-transform: uppercase;
}

/* Mini dots */
.habit-dots {
  margin-left: auto;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 6px;
}

.dots-row {
  display: flex;
  gap: 4px;
}

.dot {
  width: 7px;
  height: 7px;
  border-radius: 2px;
  background: var(--border-bright);
  transition: all 0.3s ease;
}

.dot.done-dot {
  background: var(--accent);
  box-shadow: 0 0 6px rgba(127,255,178,0.5);
}

.dot.missed-dot {
  background: rgba(255,107,107,0.3);
}

.dot.today-dot {
  outline: 1.5px solid var(--accent);
  outline-offset: 2px;
}

/* STATUS BAR */
.habit-status-bar {
  margin-top: 16px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
}

.status-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  flex-shrink: 0;
  animation: pulse 2s ease-in-out infinite;
}

@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

.status-dot.green { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
.status-dot.red { background: var(--accent3); box-shadow: 0 0 8px var(--accent3); }
.status-dot.gold { background: var(--gold); box-shadow: 0 0 8px var(--gold); }
.status-dot.grey { background: var(--muted); animation: none; }

.status-text {
  font-size: 12px;
  font-weight: 500;
  color: var(--muted2);
  line-height: 1.4;
}

.habit-delete {
  margin-left: auto;
  background: none;
  border: none;
  color: var(--muted);
  font-size: 14px;
  cursor: pointer;
  opacity: 0;
  transition: all 0.2s;
  padding: 4px 8px;
  border-radius: 8px;
}

.habit-card:hover .habit-delete { opacity: 0.5; }
.habit-delete:hover { opacity: 1 !important; color: var(--accent3); background: rgba(255,107,107,0.08); }

/* ═══ VERDICT ═══ */
.verdict-section {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 28px;
  margin-bottom: 56px;
  position: relative;
  overflow: hidden;
  backdrop-filter: blur(10px);
}

.verdict-tag {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  letter-spacing: 4px;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.verdict-tag::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

.verdict-score-big {
  font-size: 72px;
  font-weight: 900;
  line-height: 1;
  letter-spacing: -4px;
  margin-bottom: 12px;
  transition: all 0.5s;
}

.verdict-score-big.high { background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.verdict-score-big.mid { color: var(--gold); }
.verdict-score-big.low { color: var(--accent3); }

.verdict-text {
  font-size: 15px;
  font-weight: 500;
  color: var(--muted2);
  line-height: 1.6;
  margin-bottom: 24px;
  font-style: italic;
}

.verdict-stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
}

.v-stat { display: flex; flex-direction: column; gap: 4px; }
.v-stat-val { font-size: 22px; font-weight: 800; color: var(--text); }
.v-stat-label { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; }

/* ═══ RANK LADDER ═══ */
.ladder-section { margin-bottom: 56px; }
.ladder-title { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 4px; color: var(--muted); text-transform: uppercase; margin-bottom: 20px; }

.ladder-grid { display: flex; flex-direction: column; gap: 8px; }

.ladder-item {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px 20px;
  display: flex;
  align-items: center;
  gap: 14px;
  transition: all 0.2s;
  backdrop-filter: blur(10px);
}

.ladder-item.current {
  border-color: rgba(127,255,178,0.25);
  background: rgba(127,255,178,0.04);
  box-shadow: 0 0 32px rgba(127,255,178,0.06);
}

.ladder-item.cleared { opacity: 0.35; }

.rank-orb {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 800;
  letter-spacing: -1px;
  position: relative;
}

.ladder-info { flex: 1; }
.ladder-name { font-size: 15px; font-weight: 700; margin-bottom: 2px; }
.ladder-desc { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--muted); letter-spacing: 1px; }

.ladder-badge {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  letter-spacing: 2px;
  text-transform: uppercase;
  padding: 4px 10px;
  border-radius: 100px;
}

.ladder-badge.active { background: rgba(127,255,178,0.12); color: var(--accent); border: 1px solid rgba(127,255,178,0.2); }
.ladder-badge.done { color: var(--muted); }
.ladder-badge.locked { color: rgba(255,255,255,0.1); }

/* ═══ EMPTY ═══ */
.empty-state {
  text-align: center;
  padding: 64px 32px;
  background: var(--surface);
  border: 1px dashed var(--border-bright);
  border-radius: 20px;
  margin-bottom: 56px;
}

.empty-icon { font-size: 48px; margin-bottom: 20px; opacity: 0.4; }
.empty-h { font-size: 20px; font-weight: 700; color: var(--muted2); margin-bottom: 8px; }
.empty-p { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--muted); letter-spacing: 1px; line-height: 1.7; }

/* ═══ MODAL ═══ */
.modal-bg {
  position: fixed;
  inset: 0;
  background: rgba(6,6,10,0.88);
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(12px);
  animation: fadein 0.25s ease;
}

@keyframes fadein { from{opacity:0} to{opacity:1} }

.modal {
  background: #0e0e14;
  border: 1px solid var(--border-bright);
  border-radius: 24px;
  padding: 40px;
  width: 100%;
  max-width: 460px;
  position: relative;
  animation: slideup 0.3s cubic-bezier(0.23, 1, 0.32, 1);
  overflow: hidden;
}

.modal::before {
  content: '';
  position: absolute;
  top: 0; left: 50%;
  transform: translateX(-50%);
  width: 200px;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
}

@keyframes slideup { from{transform:translateY(24px);opacity:0} to{transform:translateY(0);opacity:1} }

.modal-h { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 6px; }
.modal-sub { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--muted); letter-spacing: 1px; margin-bottom: 32px; line-height: 1.6; }

.field-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 3px;
  color: var(--muted);
  text-transform: uppercase;
  display: block;
  margin-bottom: 10px;
}

.field-input {
  width: 100%;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border-bright);
  border-radius: 12px;
  color: var(--text);
  font-family: 'Outfit', sans-serif;
  font-size: 16px;
  font-weight: 500;
  padding: 14px 18px;
  margin-bottom: 24px;
  outline: none;
  transition: all 0.2s;
}

.field-input:focus { border-color: rgba(127,255,178,0.4); background: rgba(127,255,178,0.04); box-shadow: 0 0 0 3px rgba(127,255,178,0.06); }
.field-input::placeholder { color: var(--muted); }

.identity-hint {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--muted);
  margin-top: -18px;
  margin-bottom: 24px;
  letter-spacing: 0.5px;
}

.identity-hint .hl { color: var(--accent); }

.modal-btns { display: flex; gap: 12px; }

.btn-commit {
  flex: 1;
  background: linear-gradient(135deg, rgba(127,255,178,0.15), rgba(0,229,255,0.1));
  border: 1px solid rgba(127,255,178,0.3);
  border-radius: 12px;
  color: var(--accent);
  font-family: 'Outfit', sans-serif;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  padding: 14px;
  cursor: pointer;
  transition: all 0.25s;
}

.btn-commit:hover { background: linear-gradient(135deg, rgba(127,255,178,0.22), rgba(0,229,255,0.15)); transform: translateY(-1px); box-shadow: 0 8px 24px rgba(127,255,178,0.1); }

.btn-cancel {
  background: none;
  border: 1px solid var(--border-bright);
  border-radius: 12px;
  color: var(--muted2);
  font-family: 'Outfit', sans-serif;
  font-size: 14px;
  font-weight: 600;
  padding: 14px 24px;
  cursor: pointer;
  transition: all 0.2s;
}

.btn-cancel:hover { border-color: var(--muted); color: var(--text); }

/* ═══ PARTICLES CANVAS ═══ */
#particles { position: fixed; inset: 0; pointer-events: none; z-index: 500; }

/* ═══ TOAST ═══ */
.toast-container {
  position: fixed;
  bottom: 40px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2000;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  pointer-events: none;
}

.toast {
  background: rgba(14,14,20,0.95);
  border: 1px solid var(--border-bright);
  border-radius: 100px;
  padding: 12px 24px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  letter-spacing: 1px;
  color: var(--text);
  white-space: nowrap;
  backdrop-filter: blur(20px);
  animation: toastin 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
}

.toast.accent { border-color: rgba(127,255,178,0.3); color: var(--accent); }
.toast.warn { border-color: rgba(255,209,102,0.3); color: var(--gold); }
.toast.danger { border-color: rgba(255,107,107,0.3); color: var(--accent3); }

@keyframes toastin { from{transform:translateY(16px) scale(0.9);opacity:0} to{transform:translateY(0) scale(1);opacity:1} }

/* ═══ CHECK BURST ═══ */
.burst { position: fixed; pointer-events: none; z-index: 600; }
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<canvas id="particles"></canvas>

<div class="ambient ambient-1"></div>
<div class="ambient ambient-2"></div>
<div class="ambient ambient-3"></div>

<div class="app">

  <!-- HEADER -->
  <header class="header">
    <div class="logo">
      <div class="logo-main">Identity Protocol</div>
      <div class="logo-sub">Build who you are · one day at a time</div>
    </div>
    <div class="header-right">
      <div class="header-date" id="h-date"></div>
      <div class="header-time" id="h-time"></div>
    </div>
  </header>

  <!-- HERO -->
  <div class="hero">
    <div class="hero-ring-wrap">
      <svg id="score-ring" viewBox="0 0 200 200">
        <defs>
          <linearGradient id="ring-grad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#7fffb2"/>
            <stop offset="100%" stop-color="#00e5ff"/>
          </linearGradient>
          <filter id="ring-glow">
            <feGaussianBlur stdDeviation="3" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <!-- BG ring -->
        <circle cx="100" cy="100" r="85" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="8"/>
        <!-- Progress ring -->
        <circle id="ring-progress" cx="100" cy="100" r="85" fill="none"
          stroke="url(#ring-grad)" stroke-width="8" stroke-linecap="round"
          stroke-dasharray="534" stroke-dashoffset="534"
          filter="url(#ring-glow)"
          style="transition: stroke-dashoffset 1.2s cubic-bezier(0.23, 1, 0.32, 1)"/>
      </svg>
      <div class="hero-inner">
        <div class="hero-score-num" id="hero-score">0%</div>
        <div class="hero-score-label">Identity Score</div>
      </div>
    </div>

    <div class="hero-verdict" id="hero-verdict">Loading your data...</div>

    <div class="week-track" id="week-track"></div>
  </div>

  <!-- RANK BAR -->
  <div class="rank-bar-section">
    <div class="rank-top">
      <div class="rank-name-display" id="rank-name">—</div>
      <div class="rank-xp-display" id="rank-xp">0 XP</div>
    </div>
    <div class="rank-progress-bg">
      <div class="rank-progress-fill" id="rank-fill" style="width:0%"></div>
    </div>
    <div class="rank-next" id="rank-next"></div>
  </div>

  <!-- HABITS -->
  <div class="habits-header">
    <div class="habits-title">Active Habits</div>
    <button class="add-btn" onclick="openModal()">
      <span style="font-size:16px">+</span> Add Habit
    </button>
  </div>

  <div class="habits-grid" id="habits-grid"></div>

  <!-- VERDICT -->
  <div class="verdict-section" id="verdict-section"></div>

  <!-- RANK LADDER -->
  <div class="ladder-section">
    <div class="ladder-title">Rank Ladder</div>
    <div class="ladder-grid" id="ladder-grid"></div>
  </div>

</div>

<!-- MODAL -->
<div class="modal-bg" id="modal" style="display:none" onclick="bgClose(event)">
  <div class="modal">
    <div class="modal-h">Define a Habit</div>
    <div class="modal-sub">The person you want to become — what do they do every single day?</div>

    <label class="field-label">The Habit</label>
    <input class="field-input" id="inp-habit" placeholder="e.g. Read 20 pages" maxlength="50">

    <label class="field-label">Identity Statement</label>
    <input class="field-input" id="inp-identity" placeholder="I am a person who..." maxlength="70">
    <div class="identity-hint" id="identity-hint">→ e.g. <span class="hl">I am a person who reads every day</span></div>

    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-commit" onclick="addHabit()">Commit →</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toasts"></div>

<script>
// ══════════════════════════════════════════
// CONFIG
// ══════════════════════════════════════════
const RANKS = [
  {name:'KICKOFF',   desc:'First steps into the protocol.',    xp:0,     color:'#6b7280', orb:'⬡'},
  {name:'BRONZE',    desc:'Momentum is building.',             xp:150,   color:'#cd7f32', orb:'⬡'},
  {name:'SILVER',    desc:'Consistency is emerging.',          xp:500,   color:'#9ca3af', orb:'◈'},
  {name:'GOLD',      desc:'Your systems are clicking.',        xp:1200,  color:'#ffd166', orb:'◆'},
  {name:'PRO',       desc:'Precision mode activated.',         xp:2500,  color:'#b388ff', orb:'⬟'},
  {name:'ELITE',     desc:'Consistent execution.',             xp:5000,  color:'#60a5fa', orb:'◉'},
  {name:'PRIME',     desc:'Habits drive your identity.',       xp:9000,  color:'#34d399', orb:'✦'},
  {name:'TITAN',     desc:'Compounding mastery.',              xp:15000, color:'#7fffb2', orb:'❋'},
  {name:'MYTHIC',    desc:'OPS-grade daily rituals.',          xp:25000, color:'#f97316', orb:'⊛'},
  {name:'LEGENDARY', desc:'One year of unbroken identity.',    xp:52000, color:'#ef4444', orb:'★'},
];

const TODAY_VERDICTS = [
  [0,0,    "You haven't shown up today yet."],
  [1,24,   "You've barely started. The day is slipping."],
  [25,49,  "You've started. Now don't stop here."],
  [50,74,  "Halfway through your commitments today."],
  [75,99,  "Almost there. Finish what you promised yourself."],
  [100,100,"Today is done. You were the person you want to be."],
];

const WEEK_VERDICTS = [
  [0,19,   "You didn't show up for yourself this week. The gap widened."],
  [20,39,  "Weak week. Below the minimum required to change anything."],
  [40,59,  "You did enough to feel like you tried. Not enough to actually change."],
  [60,74,  "Decent week. The habit is forming — slowly, but it's forming."],
  [75,89,  "Strong week. You're proving to yourself who you are."],
  [90,99,  "Near-perfect week. This version of you is becoming permanent."],
  [100,100,"Perfect week. The identity is locked in."],
];

const MOTIVATIONAL = [
  "Every check is a vote for who you are becoming.",
  "The streak is proof. Not motivation. Proof.",
  "Identity is built in the moments nobody sees.",
  "You don't rise to your goals. You fall to your systems.",
  "One more day. That's all it ever takes.",
  "The person you want to be — they don't skip.",
];

// ══════════════════════════════════════════
// STATE
// ══════════════════════════════════════════
let S = (() => {
  try { const r = localStorage.getItem('ip_v4'); if (r) return JSON.parse(r); } catch(e){}
  return { habits:[], totalXP:0 };
})();

function save() { localStorage.setItem('ip_v4', JSON.stringify(S)); }

function today() {
  const d = new Date();
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}

function daysAgo(n) {
  const d = new Date();
  d.setDate(d.getDate() - n);
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}

function p(n) { return String(n).padStart(2,'0'); }

function calcStreak(h) {
  let c=0, i=0;
  while(h.log.includes(daysAgo(i))) { c++; i++; }
  return c;
}

function calcBest(h) {
  if (!h.log.length) return 0;
  const sorted = [...h.log].sort();
  let max=1, cur=1;
  for(let i=1;i<sorted.length;i++){
    const diff=(new Date(sorted[i])-new Date(sorted[i-1]))/86400000;
    cur = diff===1 ? cur+1 : 1;
    if(cur>max) max=cur;
  }
  return max;
}

function xpForStreak(streak) {
  if(streak>=30) return 50;
  if(streak>=14) return 30;
  if(streak>=7)  return 20;
  if(streak>=3)  return 15;
  return 10;
}

function rankIdx(xp) {
  let r=0;
  for(let i=0;i<RANKS.length;i++){ if(xp>=RANKS[i].xp) r=i; else break; }
  return r;
}

function getVerdict(pct, list) {
  for(const [lo,hi,txt] of list) if(pct>=lo&&pct<=hi) return txt;
  return '';
}

function todayScore() {
  if(!S.habits.length) return 0;
  const done = S.habits.filter(h=>h.log.includes(today())).length;
  return Math.round(done/S.habits.length*100);
}

function weekScore() {
  if(!S.habits.length) return 0;
  let tot=0, done=0;
  for(let i=0;i<7;i++){
    const k=daysAgo(i);
    S.habits.forEach(h=>{
      if(new Date(k)>=new Date(h.createdAt)){ tot++; if(h.log.includes(k)) done++; }
    });
  }
  return tot ? Math.round(done/tot*100) : 0;
}

// ══════════════════════════════════════════
// PARTICLE BURST ON CHECK
// ══════════════════════════════════════════
const pcv = document.getElementById('particles');
const pcx = pcv.getContext('2d');
let particles = [];

function resizeParticles() {
  pcv.width = window.innerWidth;
  pcv.height = window.innerHeight;
}
resizeParticles();
window.addEventListener('resize', resizeParticles);

function burst(x, y) {
  const colors = ['#7fffb2','#00e5ff','#b388ff','#ffd166','#ffffff'];
  for(let i=0;i<40;i++){
    const angle = Math.random()*Math.PI*2;
    const speed = 2 + Math.random()*6;
    particles.push({
      x, y,
      vx: Math.cos(angle)*speed,
      vy: Math.sin(angle)*speed - 2,
      life: 1,
      decay: 0.02 + Math.random()*0.03,
      size: 2 + Math.random()*4,
      color: colors[Math.floor(Math.random()*colors.length)],
    });
  }
}

function animateParticles() {
  pcx.clearRect(0,0,pcv.width,pcv.height);
  particles = particles.filter(p=>p.life>0);
  particles.forEach(p=>{
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.15;
    p.life -= p.decay;
    pcx.save();
    pcx.globalAlpha = Math.max(0,p.life);
    pcx.fillStyle = p.color;
    pcx.shadowBlur = 8;
    pcx.shadowColor = p.color;
    pcx.beginPath();
    pcx.arc(p.x,p.y,p.size,0,Math.PI*2);
    pcx.fill();
    pcx.restore();
  });
  requestAnimationFrame(animateParticles);
}
animateParticles();

// ══════════════════════════════════════════
// BG CANVAS — floating orbs
// ══════════════════════════════════════════
const bgc = document.getElementById('bg-canvas');
const bgx = bgc.getContext('2d');
let orbs = [];

function resizeBg() { bgc.width=innerWidth; bgc.height=innerHeight; }
resizeBg(); window.addEventListener('resize',resizeBg);

function initOrbs() {
  orbs = Array.from({length:12},()=>({
    x: Math.random()*innerWidth,
    y: Math.random()*innerHeight,
    r: 60+Math.random()*180,
    vx: (Math.random()-0.5)*0.15,
    vy: (Math.random()-0.5)*0.15,
    col: ['rgba(127,255,178,0.025)','rgba(0,229,255,0.02)','rgba(179,136,255,0.02)'][Math.floor(Math.random()*3)],
  }));
}
initOrbs();

function drawBg() {
  bgx.clearRect(0,0,bgc.width,bgc.height);
  orbs.forEach(o=>{
    o.x+=o.vx; o.y+=o.vy;
    if(o.x<-o.r) o.x=innerWidth+o.r;
    if(o.x>innerWidth+o.r) o.x=-o.r;
    if(o.y<-o.r) o.y=innerHeight+o.r;
    if(o.y>innerHeight+o.r) o.y=-o.r;
    const g=bgx.createRadialGradient(o.x,o.y,0,o.x,o.y,o.r);
    g.addColorStop(0,o.col);
    g.addColorStop(1,'transparent');
    bgx.fillStyle=g;
    bgx.beginPath(); bgx.arc(o.x,o.y,o.r,0,Math.PI*2); bgx.fill();
  });
  requestAnimationFrame(drawBg);
}
drawBg();

// ══════════════════════════════════════════
// CLOCK
// ══════════════════════════════════════════
function updateClock() {
  const d = new Date();
  const days = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
  const months = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  document.getElementById('h-date').textContent = `${days[d.getDay()]} · ${p(d.getDate())} ${months[d.getMonth()]}`;
  document.getElementById('h-time').textContent = `${p(d.getHours())}:${p(d.getMinutes())}`;
}
updateClock();
setInterval(updateClock, 10000);

// ══════════════════════════════════════════
// MODAL
// ══════════════════════════════════════════
function openModal() {
  document.getElementById('modal').style.display='flex';
  document.getElementById('inp-habit').value='';
  document.getElementById('inp-identity').value='';
  setTimeout(()=>document.getElementById('inp-habit').focus(),50);
}
function closeModal() { document.getElementById('modal').style.display='none'; }
function bgClose(e) { if(e.target.id==='modal') closeModal(); }

document.getElementById('inp-habit').addEventListener('input', function(){
  const v = this.value.trim();
  const hint = document.getElementById('identity-hint');
  if(v) hint.innerHTML = `→ e.g. <span class="hl">I am a person who ${v.toLowerCase()}s every day</span>`;
  else hint.innerHTML = `→ e.g. <span class="hl">I am a person who reads every day</span>`;
});

function addHabit() {
  const name = document.getElementById('inp-habit').value.trim();
  const identity = document.getElementById('inp-identity').value.trim() ||
    `I am a person who ${name.toLowerCase()}s every day`;
  if(!name) { document.getElementById('inp-habit').focus(); return; }

  S.habits.push({ id:Date.now(), name, identity, log:[], createdAt:today(), bestStreak:0 });
  save(); closeModal(); render();
  toast('Habit committed. Now prove it every day.','accent');
}

function deleteHabit(id) {
  if(!confirm('Remove this habit?')) return;
  S.habits = S.habits.filter(h=>h.id!==id);
  save(); render();
}

// ══════════════════════════════════════════
// TOGGLE
// ══════════════════════════════════════════
function toggle(id, btnEl) {
  const h = S.habits.find(x=>x.id===id);
  if(!h) return;
  const t = today();
  const already = h.log.includes(t);

  if(already) {
    h.log = h.log.filter(d=>d!==t);
    const was = xpForStreak(calcStreak(h)+1);
    S.totalXP = Math.max(0, S.totalXP - was);
    save(); render(); return;
  }

  h.log.push(t);
  const streak = calcStreak(h);
  const xp = xpForStreak(streak);
  const prevR = rankIdx(S.totalXP);
  S.totalXP += xp;
  const newR = rankIdx(S.totalXP);
  if(streak > h.bestStreak) h.bestStreak = streak;
  save();

  // Particle burst from button
  if(btnEl) {
    const rect = btnEl.getBoundingClientRect();
    burst(rect.left+rect.width/2, rect.top+rect.height/2);
  }

  if(newR > prevR) {
    setTimeout(()=>toast(`🏆 Rank Up → ${RANKS[newR].name}`,'accent'),400);
  }

  const msg = streak>=30 ? `${streak} days. Legendary.` :
              streak>=14 ? `${streak} days straight. Keep forging.` :
              streak>=7  ? `${streak} days. The identity is setting.` :
              streak>=3  ? `${streak} days. The chain holds.` :
              'Day 1 starts here. Don\'t stop.';

  toast(`+${xp} XP · ${msg}`, 'accent');

  // Random motivational
  if(Math.random() < 0.4) {
    setTimeout(()=>toast(MOTIVATIONAL[Math.floor(Math.random()*MOTIVATIONAL.length)]), 2000);
  }

  render();
}

// ══════════════════════════════════════════
// TOAST
// ══════════════════════════════════════════
function toast(msg, type='') {
  const c = document.getElementById('toasts');
  const el = document.createElement('div');
  el.className = `toast${type?' '+type:''}`;
  el.textContent = msg;
  c.appendChild(el);
  setTimeout(()=>{
    el.style.transition='opacity 0.4s,transform 0.4s';
    el.style.opacity='0';
    el.style.transform='translateY(8px)';
    setTimeout(()=>el.remove(),400);
  }, 3500);
}

// ══════════════════════════════════════════
// RENDER
// ══════════════════════════════════════════
function render() {
  renderHero();
  renderRankBar();
  renderHabits();
  renderVerdict();
  renderLadder();
}

function renderHero() {
  const score = todayScore();
  const circ = 2*Math.PI*85;
  const offset = circ - (score/100)*circ;
  document.getElementById('ring-progress').style.strokeDashoffset = offset;
  document.getElementById('hero-score').textContent = score+'%';
  document.getElementById('hero-verdict').textContent = getVerdict(score, TODAY_VERDICTS);

  // Week track
  const wt = document.getElementById('week-track');
  wt.innerHTML = '';
  const dayLabels = ['M','T','W','T','F','S','S'];

  for(let i=6;i>=0;i--){
    const k = daysAgo(i);
    let done=0, possible=0;
    S.habits.forEach(h=>{
      if(new Date(k)>=new Date(h.createdAt)){
        possible++;
        if(h.log.includes(k)) done++;
      }
    });
    const pct = possible ? done/possible : 0;
    const isToday = i===0;
    const d = new Date(); d.setDate(d.getDate()-i);
    const col = document.createElement('div');
    col.className='week-col';
    col.innerHTML = `
      <div class="week-pip${pct===1&&possible>0?' full':''}${pct>0&&pct<1?' partial':''}${isToday?' today-pip':''}"></div>
      <div class="week-label">${dayLabels[(d.getDay()+6)%7]}</div>
    `;
    wt.appendChild(col);
  }
}

function renderRankBar() {
  const xp = S.totalXP;
  const ri = rankIdx(xp);
  const rank = RANKS[ri];
  const next = RANKS[ri+1];

  const el = document.getElementById('rank-name');
  el.textContent = rank.name;
  el.style.color = rank.color;
  document.getElementById('rank-xp').textContent = xp.toLocaleString()+' XP';

  if(next) {
    const pct = ((xp-rank.xp)/(next.xp-rank.xp))*100;
    document.getElementById('rank-fill').style.width = Math.min(pct,100)+'%';
    document.getElementById('rank-next').textContent = `${(next.xp-xp).toLocaleString()} XP to ${next.name}`;
  } else {
    document.getElementById('rank-fill').style.width='100%';
    document.getElementById('rank-next').textContent='Maximum rank achieved.';
  }
}

function renderHabits() {
  const grid = document.getElementById('habits-grid');

  if(!S.habits.length) {
    grid.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">◎</div>
        <div class="empty-h">No habits defined yet.</div>
        <div class="empty-p">
          Every day without a habit<br>
          is a day you're confirming who you currently are.<br><br>
          Start with one. Just one.
        </div>
      </div>`;
    return;
  }

  grid.innerHTML = '';
  const t = today();

  S.habits.forEach((h,idx)=>{
    const done = h.log.includes(t);
    const streak = calcStreak(h);
    const best = calcBest(h);
    const yest = daysAgo(1);
    const hadYest = h.log.includes(yest);
    const broken = !done && !hadYest && h.log.length>0;
    const hour = new Date().getHours();

    // 21-day dots
    const dots = [];
    for(let i=20;i>=0;i--){
      const k=daysAgo(i);
      const active = new Date(k)>=new Date(h.createdAt);
      dots.push({
        on: active&&h.log.includes(k),
        missed: active&&!h.log.includes(k)&&i>0,
        isToday: i===0,
      });
    }

    // Status
    let statusDot='grey', statusMsg='';
    if(done) {
      if(streak>=14) { statusDot='green'; statusMsg=`${streak} days straight. The identity is setting in.`; }
      else if(streak>=7) { statusDot='green'; statusMsg=`${streak} day streak. Keep the chain alive.`; }
      else if(streak>=3) { statusDot='green'; statusMsg=`${streak} days in a row. Momentum is real.`; }
      else { statusDot='green'; statusMsg=`Done. Come back tomorrow — that's what matters.`; }
    } else if(broken) {
      statusDot='red';
      const lostC = (()=>{let c=0,i=1; while(h.log.includes(daysAgo(i))){c++;i++;} return c;})();
      statusMsg = lostC>0
        ? `Streak of ${lostC} days broken. Restart today or accept this is who you are right now.`
        : `Not done today. The streak is waiting.`;
    } else {
      if(hour>=22) { statusDot='red'; statusMsg='Less than 2 hours left. Do it now.'; }
      else if(hour>=19) { statusDot='gold'; statusMsg='Evening — still time. Don\'t go to sleep without this done.'; }
      else if(hour>=12) { statusDot='gold'; statusMsg='Afternoon. Still ahead of the day.'; }
      else { statusDot='grey'; statusMsg='Not done yet. You have time.'; }
    }

    const card = document.createElement('div');
    card.className = `habit-card${done?' done':''}${broken?' broken':''}`;
    card.style.animationDelay = `${idx*80}ms`;

    card.innerHTML = `
      <div class="habit-card-glow"></div>
      <div class="habit-row1">
        <div>
          <div class="habit-identity">${h.identity}</div>
          <div class="habit-name">${h.name}</div>
        </div>
        <button class="check-btn${done?' checked':''}" onclick="toggle(${h.id},this)" id="chk-${h.id}">
          <span class="check-icon">${done?'✓':'○'}</span>
        </button>
      </div>
      <div class="habit-stats">
        <div class="stat-block">
          <div class="stat-val ${streak>=14?'col-green':streak>=5?'col-gold':'col-muted'}">${streak}</div>
          <div class="stat-label">STREAK</div>
        </div>
        <div class="stat-block">
          <div class="stat-val col-muted">${best}</div>
          <div class="stat-label">BEST</div>
        </div>
        <div class="habit-dots">
          <div class="dots-row">
            ${dots.slice(0,11).map(d=>`<div class="dot${d.on?' done-dot':''}${d.missed?' missed-dot':''}${d.isToday?' today-dot':''}"></div>`).join('')}
          </div>
          <div class="dots-row">
            ${dots.slice(11).map(d=>`<div class="dot${d.on?' done-dot':''}${d.missed?' missed-dot':''}${d.isToday?' today-dot':''}"></div>`).join('')}
          </div>
        </div>
      </div>
      <div class="habit-status-bar">
        <div class="status-dot ${statusDot}"></div>
        <div class="status-text">${statusMsg}</div>
        <button class="habit-delete" onclick="deleteHabit(${h.id})">✕</button>
      </div>
    `;

    grid.appendChild(card);
  });
}

function renderVerdict() {
  const ws = weekScore();
  const cls = ws>=75?'high':ws>=50?'mid':'low';
  const txt = getVerdict(ws, WEEK_VERDICTS);

  let totalD=0, totalP=0, bestS=0;
  S.habits.forEach(h=>{
    for(let i=0;i<7;i++){
      const k=daysAgo(i);
      if(new Date(k)>=new Date(h.createdAt)){totalP++;if(h.log.includes(k))totalD++;}
    }
    const s=calcStreak(h); if(s>bestS) bestS=s;
  });

  document.getElementById('verdict-section').innerHTML = `
    <div class="verdict-tag">Weekly Verdict</div>
    <div class="verdict-score-big ${cls}">${ws}%</div>
    <div class="verdict-text">${txt}</div>
    <div class="verdict-stats">
      <div class="v-stat"><div class="v-stat-val">${totalD}/${totalP}</div><div class="v-stat-label">This Week</div></div>
      <div class="v-stat"><div class="v-stat-val">${bestS}d</div><div class="v-stat-label">Best Streak</div></div>
      <div class="v-stat"><div class="v-stat-val">${S.habits.length}</div><div class="v-stat-label">Habits</div></div>
      <div class="v-stat"><div class="v-stat-val">${S.totalXP.toLocaleString()}</div><div class="v-stat-label">Total XP</div></div>
    </div>
  `;
}

function renderLadder() {
  const grid = document.getElementById('ladder-grid');
  const ri = rankIdx(S.totalXP);
  grid.innerHTML = '';

  RANKS.forEach((r,i)=>{
    const isCur = i===ri, isCleared = i<ri;
    const el = document.createElement('div');
    el.className = `ladder-item${isCur?' current':''}${isCleared?' cleared':''}`;
    el.innerHTML = `
      <div class="rank-orb" style="background:${r.color}18;color:${r.color};border:1px solid ${r.color}33">${r.orb}</div>
      <div class="ladder-info">
        <div class="ladder-name" style="color:${isCur?r.color:'inherit'}">${r.name}</div>
        <div class="ladder-desc">${r.desc} · ${r.xp.toLocaleString()} XP</div>
      </div>
      <div class="ladder-badge ${isCur?'active':isCleared?'done':'locked'}">
        ${isCur?'CURRENT':isCleared?'CLEARED':'LOCKED'}
      </div>
    `;
    grid.appendChild(el);
  });
}

// Keyboard
document.addEventListener('keydown', e=>{
  if(e.key==='Escape') closeModal();
  if(e.key==='Enter' && document.getElementById('modal').style.display!=='none') addHabit();
});

// Init
S.habits.forEach(h=>{ if(!h.log) h.log=[]; if(!h.bestStreak) h.bestStreak=0; });
render();
</script>
